[project]
name = "mas-llm-bricks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bpy>=5.2.3",
    "dotenv>=0.9.9",
    "pydantic-ai-slim[logfire,openai]>=2.59.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mason"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

# ---------------------------------------------------------------------------
# Ruff — formatter + linter (replaces black, isort, flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# E = pycodestyle errors, W = warnings, F = pyflakes, I = isort
# Lightweight rule-set suitable for a research codebase.
select = ["E", "F", "I", "W"]
ignore = [
    "E501", # line too long — let the formatter handle wrapping
]

[tool.ruff.lint.isort]
known-first-party = ["mason"]
combine-as-imports = true

[tool.logfire]
local = true
